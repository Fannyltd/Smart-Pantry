[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-pantry"
version = "1.0.0"
description = "Gestion intelligente des stocks alimentaires : péremptions, recettes TheMealDB, liste de courses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
